<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>AURA — Return to Home</title>
  </head>
  <body>
    <main class="browser-controls" aria-label="AURA website controls">
      <div class="browser-heading">
        <strong id="service-title">AURA website</strong
        ><span id="service-origin"></span>
      </div>
      <p id="browser-status" role="status" aria-live="polite">
        Connecting to AURA controls…
      </p>
      <div class="browser-actions">
        <button id="browser-home" class="primary">⌂ Return to AURA Home</button>
        <button id="browser-retry" class="secondary">Retry</button>
        <button id="browser-external" class="secondary">
          Open externally ↗
        </button>
      </div>
    </main>
    <script type="module" src="/src/browser-controls.js"></script>
  </body>
</html>
