[package]
name = "aura-home-media"
version = "0.1.0"
description = "Touch-first Surface media launcher"
authors = ["AURA"]
edition = "2021"

[lib]
name = "aura_home_media_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[features]
# ADR-008: the stable floating-window spike obscured sites. Keep the child
# webview experiment explicit and pin the API version used by both builds.
default = ["embedded-browser"]
embedded-browser = ["tauri/unstable"]

[dependencies]
tauri = { version = "=2.12.4", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }
