name: Build Windows installers
on:
  workflow_dispatch:
  push:
    branches: ["main"]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  windows-installers:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2025
            target: x86_64-pc-windows-msvc
            label: x64
          - os: windows-11-vs2026-arm
            target: aarch64-pc-windows-msvc
            label: arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.99.1"
          targets: ${{ matrix.target }}
          components: rustfmt, clippy
      - name: Install JS dependencies
        run: npm ci
      - name: Frontend checks
        run: npm run check
      - name: Install test browser
        run: npx playwright install chromium
      - name: Browser preview tests
        run: npm run test:ui
      - name: Rust checks
        run: |
          cargo fmt --manifest-path src-tauri/Cargo.toml -- --check
          cargo test --manifest-path src-tauri/Cargo.toml --locked --target ${{ matrix.target }}
      - name: Build architecture-specific installer
        run: npm run tauri:build -- --target ${{ matrix.target }} -- --locked
      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: aura-home-media-${{ matrix.label }}
          path: src-tauri/target/${{ matrix.target }}/release/bundle/nsis/*-setup.exe
          if-no-files-found: error
